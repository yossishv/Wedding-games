<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f1e6cc">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gili & Josh · The Wedding Games</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{--paper:#f1e6cc;--ink:#2f5a37;--rust:#b5391c;--sun:#e0a030;--tile:#f6eed9;--g0:#e0a030;--g1:#8fae84;--g2:#d9694a;--g3:#c9b27a;--gt:#1f2a1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1c241d;--ink:#cfe0c4;--rust:#e0603f;--tile:#26322a}}
:root[data-theme="dark"]{--paper:#1c241d;--ink:#cfe0c4;--rust:#e0603f;--tile:#26322a}
*{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;-webkit-tap-highlight-color:transparent}
#splash{position:fixed;inset:0;z-index:9;--paper:#f8f6f0;background:#f8f6f0;color:#3d4a3a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .9s ease;padding:24px;text-align:center}
#splash.out{opacity:0;pointer-events:none}
#splash svg{width:min(24vw,96px);height:auto;color:#1c1c1c;animation:bloom 2.2s ease-out both}
@keyframes bloom{from{opacity:0;transform:scale(.88) rotate(-6deg)}to{opacity:1;transform:none}}
#splash h1{font-size:clamp(3.4rem,18vw,5.2rem);line-height:1;margin:14px 0 0;font-weight:500;letter-spacing:-.01em;animation:rise 1.4s .9s ease-out both}
#splash p{margin:6px 0 0;font-size:1.7rem;font-style:italic;font-weight:500;color:#c0693c;animation:rise 1.4s 1.3s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
main{max-width:480px;margin:0 auto;padding:16px 16px 32px}
.banner{border:3px solid var(--ink);border-radius:6px;display:flex;align-items:center;gap:14px;padding:10px 14px}
.banner svg{width:56px;height:auto;flex:none;color:var(--ink)}
.banner h2{margin:0;font-size:1.25rem}
.banner span{font-size:.9rem}
.dots{display:flex;align-items:center;gap:10px;margin:16px 0 12px;justify-content:center}
.dots:before,.dots:after{content:"";flex:1;height:2px;background:var(--ink)}
.dots i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--ink);display:block}
.dots i.on{background:var(--rust);border-color:var(--rust)}
#msg{min-height:1.6em;text-align:center;font-weight:700;font-size:1.3rem;margin:0 0 10px}
.rows{display:grid;gap:8px}
.row{border-radius:8px;padding:10px 6px;text-align:center;color:var(--gt);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.05rem}
.row.new{animation:rise .5s both}
.row b{display:block;font-size:1.4rem;font-family:'Cormorant Garamond',Georgia,serif}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.tile{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(.7rem,3.1vw,1.05rem);text-transform:uppercase;line-height:1.05;min-height:68px;padding:4px;border:2.5px solid var(--ink);border-radius:8px;background:var(--tile);color:var(--ink);cursor:pointer;overflow-wrap:anywhere}
.tile.sel{background:var(--ink);color:var(--paper)}
.tile:focus-visible,.btn:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bar{display:flex;gap:10px;margin-top:18px}
.btn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.25rem;text-transform:uppercase;padding:14px;border-radius:8px;border:2.5px solid var(--ink);background:none;color:var(--ink);cursor:pointer}
.btn.go{flex:2;background:var(--rust);border-color:var(--rust);color:#fff}
.btn.alt{flex:1}
.btn:disabled{opacity:.45}
.wait{text-align:center;margin-top:48px;line-height:1.5}
.wgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:300px;margin:8px auto 0}
.wt{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(1.5rem,8vw,2rem);border:2.5px solid var(--ink);border-radius:8px;background:var(--tile);color:var(--ink)}
.wt.c,.key.c{background:#6f9a4a;border-color:#6f9a4a;color:#fff}
.wt.p,.key.p{background:#e8a93a;border-color:#e8a93a;color:#2b2108}
.wt.x,.key.x{background:#b8ad92;border-color:#b8ad92;color:#1f2a1f}
.wt.rev{animation:flip .5s both}
@keyframes flip{from{transform:rotateX(90deg)}to{transform:none}}
.kb{display:grid;gap:6px;margin-top:16px}
.kr{display:flex;gap:4px;justify-content:center}
.key{flex:1;min-width:0;max-width:34px;height:46px;padding:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:1.15rem;border:2.5px solid var(--ink);border-radius:6px;background:var(--tile);color:var(--ink);cursor:pointer}
.key:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
.pic{display:block;width:100%;height:auto;margin-top:8px;border:3px solid var(--ink);border-radius:6px;background:var(--tile)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.chips span{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;border:2px solid var(--rust);color:var(--rust);border-radius:999px;padding:2px 10px;text-decoration:line-through}
.guess{display:block;width:100%;margin-top:14px;font:700 1.35rem 'Barlow Condensed',sans-serif;text-transform:uppercase;text-align:center;padding:12px;border:2.5px solid var(--ink);border-radius:8px;background:var(--tile);color:var(--ink)}
.guess:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
.guess:disabled{opacity:.6}
#pv{max-width:480px;margin:0 auto;padding:0 16px 28px;text-align:center}
#pv button{font:inherit;margin:0 3px;padding:4px 12px;border:2px solid var(--ink);border-radius:999px;background:none;color:var(--ink);cursor:pointer}
.art{display:block;width:100%;height:auto}
.tag{display:flex;justify-content:center;align-items:center;background:var(--sun);color:#1f2a1f;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:1.6rem;letter-spacing:.01em;padding:4px 14px;margin-top:8px;border-radius:4px}
.sp{width:30px;height:20px;flex:none}.sp.r{transform:scaleX(-1)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Full-screen, no-scroll layout */
html,body{height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{display:flex;flex-direction:column}
main,#pv{width:100%;max-width:480px;margin-left:auto;margin-right:auto}
main{flex:1;min-height:0;padding:6px 12px 4px;display:flex;flex-direction:column;container-type:size}
main[hidden],#pv[hidden]{display:none}
.gbox{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.gbox.off{display:none}
.art{flex:none;object-fit:cover;border-radius:4px}
.art.top{height:auto;aspect-ratio:946/236}
.art.foot{height:clamp(34px,8cqh,66px);object-position:50% 70%;margin-top:auto;border-radius:0}
@container (max-height:560px){.art.foot{display:none}}
@container (max-height:420px){.art.top{display:none}}
.dots{flex:none;margin:0}.dots i{width:14px;height:14px;border-width:2px}
#msg{flex:none;margin:0;min-height:1.2em;font-size:1.15rem;line-height:1.2}
.rows{flex:none;gap:6px}
.rows:empty{display:none}
.board{flex:none;margin:auto 0;display:flex;flex-direction:column;gap:6px}
.row{padding:4px 6px;font-size:.95rem;line-height:1.15}.row b{font-size:1.1rem}
.grid{flex:none;margin:0;gap:6px;grid-template-rows:none;grid-auto-rows:clamp(40px,9.5cqh,64px)}
.tile{min-height:0;height:100%;align-self:stretch;padding:2px}
.bar{flex:none;margin:0;gap:8px}
.btn{padding:9px;font-size:1.1rem}
.wslot,.pslot{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center}
.wgrid{grid-template-columns:repeat(5,var(--ts,40px));grid-auto-rows:var(--ts,40px);gap:5px;margin:0;max-width:none}
.wt{aspect-ratio:auto;font-size:calc(var(--ts,40px)*.55)}
.kb{flex:none;margin:0;gap:4px}
.key{height:clamp(34px,6cqh,44px)}
.pic{width:auto;height:auto;max-width:100%;max-height:100%;margin:0;border:0;border-radius:6px}
.chips{flex:none;margin:0;gap:4px}.chips span{padding:0 8px;font-size:.95rem}
.guess{flex:none;margin:0;padding:8px;font-size:1.25rem}
#pv{flex:none;padding:2px 12px 6px}
#pv{display:flex;flex-wrap:nowrap;justify-content:center;gap:4px;overflow-x:auto}
#pv button{font-size:.85rem;padding:3px 8px;margin:0;white-space:nowrap}
#pv button.on{background:var(--ink);color:var(--paper)}
</style>
</head>

<script>

  var L=[[1,[-72,-54,-36,-18,0,18,36,54,72]],[.78,[-46,-23,0,23,46]],[.54,[-24,0,24]]];
  L.forEach(function(l){l[1].slice().sort(function(x,y){return Math.abs(y)-Math.abs(x)}).forEach(function(a){s+='<path fill="var(--paper)" d="M0 0C-14-18-12-48 0-66C12-48 14-18 0 0Z" transform="translate(100 140) rotate('+a+') scale('+l[0]+')"/>'})});
  s+='</g>';
  document.getElementById('protea').innerHTML=s;
})();

// Today's puzzle (4 groups of 4)
var PUZZLE=[
 {n:'Can be used to describe Doug',w:['FISH','TAXI DRIVER','DOWN FACING DOG','POTATO']},
 {n:'How and where it all started',w:['HALLOWEEN','HIGHLINE','SAN FRANCISCO','MINERVA']},
 {n:'Places travelled to together',w:['HAWAII','TEL-AVIV','SEOUL','LONDON']},
 {n:'The couple’s officially recognized proficiencies',w:['DEBATE','JUDO','YOGA','NEUROSCIENCE']}
];
// Answers for the Wordle-style games
var WORDS={cheer:'CHEER',cupid:'CUPID',match:'MATCH'};
// Games live each weekday (0=Sun ... 6=Sat). When a day lists two games, guests see Game 1 / Game 2 tabs.
var DAYS={1:['connections','cupid'],2:['cheer','match'],3:['picsle']};
// Labels in the review bar. Wordle 1 = CHEER, Wordle 2 = CUPID, Wordle 3 = MATCH
var NAMES={connections:'Connections',cheer:'Wordle 1',cupid:'Wordle 2',match:'Wordle 3',picsle:'Picsle'};
// Review mode: no schedule, a small bar at the bottom lists every game. Set to false to use the weekday schedule (DAYS above)
var PREVIEW=true;
// Picsle: a = accepted answers (lowercase, first is shown), img = key in PICS
var PICSLE={a:['dougy','doug'],img:'pup'};

var app=document.getElementById('app'),splash=document.getElementById('splash');
function reveal(){
  if(splash.classList.contains('out'))return;
  splash.classList.add('out');
  app.hidden=false;refit();
  setTimeout(function(){splash.remove()},1000);
}
setTimeout(reveal,4500);
function goFull(){try{var e=document.documentElement,r=(e.requestFullscreen||e.webkitRequestFullscreen).call(e);if(r&&r.catch)r.catch(function(){})}catch(x){}}
splash.addEventListener('click',function(){goFull();reveal()});

var ov='';try{ov=location.hash.slice(1)}catch(e){}
var today=DAYS[new Date().getDay()]||[],boxes={},cur=null,pv=document.getElementById('pv');
if(false){
  app.innerHTML='<div class="banner"><h2>Gili & Josh<br><span>The Wedding Games</span></h2></div><p class="wait">No game today.<br>New games go live Monday, Tuesday and Wednesday.</p>';
}else{ setTimeout(function(){launch('cheer')},0); }
function launch(g){
  document.onkeydown=null;
  for(var k in boxes)boxes[k].classList.add('off');
  var b=boxes[g];
  if(!b){b=boxes[g]=document.createElement('div');b.className='gbox';app.appendChild(b);
    if(g=='picsle')picsle(PICSLE,b);else if(WORDS[g])wordle(WORDS[g],b);else connections(PUZZLE,b)}
  b.classList.remove('off');cur=g;
  document.onkeydown=b.kd||null;if(b.fit)b.fit();bar();
}
function bar(){pv.hidden=true;return;
  var list=PREVIEW?Object.keys(NAMES):today;
  if(list.length<2){pv.hidden=true;return}
  var h='';
  list.forEach(function(g,i){h+='<button data-g="'+g+'"'+(g==cur?' class="on"':'')+'>'+(PREVIEW?NAMES[g]:'Game '+(i+1))+'</button>'});
  pv.innerHTML=h;pv.hidden=false;
}
pv.onclick=function(e){var g=e.target.dataset&&e.target.dataset.g;if(g&&g!=cur)launch(g)};
function refit(){var b=boxes[cur];if(b&&b.fit)b.fit()}
window.addEventListener('resize',refit);
if(window.visualViewport)window.visualViewport.addEventListener('resize',refit);

function wordle(ans,app){
  var rows=[],cur='',over=false,fresh=false,st={},msgText='Guess the five-letter word.',KB=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
  function score(g){var r=['x','x','x','x','x'],n={},i;for(i=0;i<5;i++){if(g[i]==ans[i])r[i]='c';else n[ans[i]]=(n[ans[i]]||0)+1}for(i=0;i<5;i++){if(r[i]!='c'&&n[g[i]]>0){r[i]='p';n[g[i]]--}}return r}
  function draw(){
    var left=6-rows.length,h=artTop()+'<div class="dots" aria-label="'+left+' tries left">'+SP;
    for(var d=0;d<6;d++)h+='<i class="'+(d<left?'on':'')+'"></i>';
    h+=SP.replace('class="sp"','class="sp r"')+'</div><p id="msg" aria-live="polite">'+msgText+'</p><div class="wslot"><div class="wgrid">';
    for(var r=0;r<6;r++){var g=rows[r],sc=g?score(g):null;for(var c=0;c<5;c++){
      var ch=g?g[c]:(r==rows.length&&!over?(cur[c]||''):''),k=g?' '+sc[c]+(fresh&&r==rows.length-1?' rev':''):'';
      h+='<div class="wt'+k+'" style="animation-delay:'+(c*120)+'ms">'+ch+'</div>';}}
    h+='</div></div><div class="kb">';
    KB.forEach(function(row){h+='<div class="kr">';row.split('').forEach(function(l){h+='<button class="key'+(st[l]?' '+st[l]:'')+'" data-k="'+l+'">'+l+'</button>'});h+='</div>'});
    h+='</div><div class="bar"><button class="btn go" id="go"'+(cur.length==5&&!over?'':' disabled')+'>Submit</button><button class="btn alt" id="clr"'+(cur.length&&!over?'':' disabled')+'>Delete</button></div>'+artFoot();
    app.innerHTML=h;fresh=false;fit();
    app.querySelectorAll('.key').forEach(function(b){b.onclick=function(){type(b.dataset.k)}});
    app.querySelector('#go').onclick=submit;
    app.querySelector('#clr').onclick=del;
  }
  function fit(){var s=app.querySelector('.wslot');if(!s)return;var t=Math.floor(Math.min((s.clientHeight-25)/6,(s.clientWidth-20)/5,68));s.style.setProperty('--ts',Math.max(24,t||0)+'px')}
  function type(l){if(over||cur.length>=5)return;cur+=l;draw()}
  function del(){if(over||!cur.length)return;cur=cur.slice(0,-1);draw()}
  function submit(){
    if(over||cur.length<5)return;
    var sc=score(cur),rank={x:1,p:2,c:3};
    cur.split('').forEach(function(l,i){if(!st[l]||rank[sc[i]]>rank[st[l]])st[l]=sc[i]});
    rows.push(cur);fresh=true;
    if(cur==ans){over=true;msgText='Cheers! You got it in '+rows.length+(rows.length==1?' try.':' tries.');setTimeout(celebrate,900)}
    else if(rows.length==6){over=true;msgText='Out of tries. The word was '+ans+'.'}
    else msgText='Keep going!';
    cur='';draw();
  }
  app.fit=fit;app.kd=function(e){if(e.ctrlKey||e.metaKey||e.altKey)return;if(/^[a-zA-Z]$/.test(e.key))type(e.key.toUpperCase());else if(e.key=='Backspace')del();else if(e.key=='Enter')submit()};
  draw();
}

// Picsle photos (embedded, keyed by name)
var PICS={};
function picsle(cfg,app){
  var PX=[4,7,12,22,40],tries=0,wrong=[],over=false,msgText='Who is in the photo? Each wrong guess sharpens it.',im=new Image();
  function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function paint(){
    var cv=app.querySelector('#pic');if(!cv||!im.naturalWidth)return;
    var W=cv.width=720,H=cv.height=Math.round(720*im.naturalHeight/im.naturalWidth),x=cv.getContext('2d');
    if(over){x.drawImage(im,0,0,W,H);return}
    var w=PX[Math.min(tries,PX.length-1)],h=Math.max(1,Math.round(w*H/W)),o=document.createElement('canvas');
    o.width=w;o.height=h;o.getContext('2d').drawImage(im,0,0,w,h);
    x.imageSmoothingEnabled=false;x.drawImage(o,0,0,w,h,0,0,W,H);
  }
  function draw(){
    var left=5-tries,h=artTop()+'<div class="dots" aria-label="'+left+' tries left">'+SP;
    for(var d=0;d<5;d++)h+='<i class="'+(d<left?'on':'')+'"></i>';
    h+=SP.replace('class="sp"','class="sp r"')+'</div><p id="msg" aria-live="polite">'+msgText+'</p>';
    h+='<div class="pslot"><canvas id="pic" class="pic" role="img" aria-label="Mystery photo"></canvas></div><div class="chips">'+wrong.map(function(g){return '<span>'+esc(g)+'</span>'}).join('')+'</div>';
    h+='<input id="guess" class="guess" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Type your guess"'+(over?' disabled':'')+'>';
    h+='<div class="bar"><button class="btn go" id="go"'+(over?' disabled':'')+'>Submit</button><button class="btn alt" id="clr"'+(over?' disabled':'')+'>Delete</button></div>'+artFoot();
    app.innerHTML=h;paint();
    var el=app.querySelector('#guess');
    el.onkeydown=function(e){if(e.key=='Enter')submit()};
    app.querySelector('#go').onclick=submit;
    app.querySelector('#clr').onclick=function(){el.value='';el.focus()};
    if(!over&&tries)el.focus();
  }
  function submit(){
    if(over)return;
    var g=app.querySelector('#guess').value.trim();
    if(!g){msgText='Type a guess first.';draw();return}
    var n=g.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ');
    if(cfg.a.indexOf(n)>-1){over=true;msgText='Cheers! You got it in '+(tries+1)+(tries?' tries.':' try.');setTimeout(celebrate,300)}
    else{wrong.push(g);tries++;if(tries>=5){over=true;msgText='Out of tries. It was '+cfg.a[0].toUpperCase()+'.'}else msgText='Not quite. The photo just sharpened.'}
    draw();
  }
  im.onload=paint;im.src=PICS[cfg.img];
  draw();
}

// Celebration: linocut-colored fireworks and petals
function celebrate(){
  var rm=false;try{rm=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
  if(rm)return;
  var old=document.getElementById('fx');if(old)old.remove();
  var cv=document.createElement('canvas');cv.id='fx';
  cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8';
  var dpr=Math.min(window.devicePixelRatio||1,2),W=window.innerWidth,H=window.innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;document.body.appendChild(cv);
  var x=cv.getContext('2d');x.scale(dpr,dpr);
  var C=['#b5482f','#e8a93a','#6f9a4a','#2f5a37','#e08a55'],P=[],t0=0,bursts=0;
  function burst(){
    var cx=W*(.15+Math.random()*.7),cy=H*(.12+Math.random()*.38),col=C[bursts%C.length];
    for(var i=0;i<34;i++){var a=i/34*6.283+Math.random()*.15,s=3+Math.random()*3.2;P.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c:i%3?col:C[(i+bursts)%C.length],l:0,p:i%4==0,r:Math.random()*6})}
    bursts++;
  }
  function frame(ts){
    if(!t0)t0=ts;
    var t=ts-t0;
    if(bursts<6&&t>bursts*450)burst();
    x.clearRect(0,0,W,H);
    P=P.filter(function(q){return q.l<85});
    P.forEach(function(q){
      q.vx*=.985;q.vy=q.vy*.985+.06;q.x+=q.vx;q.y+=q.vy;q.l++;
      x.globalAlpha=Math.max(0,1-q.l/85);x.fillStyle=x.strokeStyle=q.c;
      if(q.p){x.beginPath();x.ellipse(q.x,q.y,3,7,q.r+q.l*.08,0,6.283);x.fill()}
      else{x.lineWidth=3;x.lineCap='round';x.beginPath();x.moveTo(q.x,q.y);x.lineTo(q.x-q.vx*2.5,q.y-q.vy*2.5);x.stroke()}
    });
    if(t<4600)requestAnimationFrame(frame);else cv.remove();
  }
  requestAnimationFrame(frame);
}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

function connections(groups,app){
  var words=shuffle([].concat.apply([],groups.map(function(g){return g.w}))),
      sel=[],solved=[],newRow=null,lives=3,over=false,msgText='Pick four words that belong together.';
  function draw(){
    var h=artTop();
    h+='<div class="dots" aria-label="'+lives+' mistakes left">'+SP;
    for(var d=0;d<3;d++)h+='<i class="'+(d<lives?'on':'')+'"></i>';
    h+=SP.replace('class="sp"','class="sp r"')+'</div><p id="msg" aria-live="polite">'+msgText+'</p><div class="board"><div class="rows">';
    solved.forEach(function(g){var k=groups.indexOf(g);h+='<div class="row'+(g===newRow?' new':'')+'" style="background:var(--g'+k+')"><b>'+g.n+'</b>'+g.w.join(', ')+'</div>'});
    h+='</div><div class="grid" style="--r:'+Math.max(1,Math.ceil(words.length/4))+'">';
    words.forEach(function(w){h+='<button class="tile'+(sel.indexOf(w)>-1?' sel':'')+'" data-w="'+w+'">'+w+'</button>'});
    h+='</div></div><div class="bar"><button class="btn go" id="go"'+(sel.length==4&&!over?'':' disabled')+'>Submit</button><button class="btn alt" id="clr"'+(sel.length&&!over?'':' disabled')+'>Deselect</button></div>'+artFoot();
    app.innerHTML=h;newRow=null;
    app.querySelectorAll('.tile').forEach(function(b){b.onclick=function(){if(over)return;var w=b.dataset.w,i=sel.indexOf(w);if(i>-1)sel.splice(i,1);else if(sel.length<4)sel.push(w);draw()}});
    app.querySelector('#go').onclick=submit;
    app.querySelector('#clr').onclick=function(){sel=[];draw()};
  }
  function submit(){
    var best=0,hit=null;
    groups.forEach(function(g){var c=g.w.filter(function(w){return sel.indexOf(w)>-1}).length;if(c>best)best=c;if(c==4)hit=g});
    if(hit){
      solved.push(hit);newRow=hit;words=words.filter(function(w){return hit.w.indexOf(w)<0});sel=[];
      if(solved.length==4){over=true;msgText='You got them all. Well played!';setTimeout(celebrate,200)}else msgText='Nice one!';
      draw();return;
    }
    lives--;msgText=best==3?'3 out of 4. So close, try again!':'Not quite. Try again.';
    if(lives==0){
      over=true;msgText='Out of mistakes. Here are the answers.';
      groups.forEach(function(g){if(solved.indexOf(g)<0)solved.push(g)});words=[];sel=[];
    }
    draw();
    if(!over)app.querySelectorAll('.tile.sel').forEach(function(t){t.classList.add('shake')});
  }
  draw();
}
</script>
